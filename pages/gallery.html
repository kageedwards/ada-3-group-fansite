      <header>
        <h1>Twilight Sparkle Photo Gallery</h1>
        <p>Enjoy some photos of everyone's favorite pony, Twilight Sparkle</p>
      </header>
    </article>

    <section class="gallery-grid">
      <figure>
        <a href="https://mlp.fandom.com/wiki/Twilight_Sparkle#Development_and_design">
          <img src="../assets/img/gallery/pony_sketch.png" alt="A hand-drawn prototype sketch of what would become Twilight Sparkle.">
        </a>
        <figcaption>A hand-drawn prototype sketch by creator Lauren Faust. Faust was inspired by her childhood Twilight pony, a G1 character.</figcaption>
      </figure>

      <figure>
        <a href="https://equestriagirls.fandom.com/wiki/Twilight_Sparkle_(Sci-Twi)">
          <img src="../assets/img/gallery/human.png" alt="Twilight Sparkle's human form">
        </a>
        <figcaption>
          Twilight Sparkle (Sci-Twi) is one of the Fourth Generation MLP protagonists. 
          Here she is shown in her human form.
        </figcaption>
      </figure>

      <figure>
        <a href="https://g5mlp.fandom.com/wiki/Twilight_Sparkle">
          <img src="../assets/img/gallery/pony_form.png" alt="Twilight Sparkle's 5th Generation pony form.">
        </a>
        <figcaption>Twilight Sparkle as depicted in her pony form, 5th Generation.</figcaption>
      </figure>

      <figure>
        <a href="https://en.wikipedia.org/wiki/Twilight_Sparkle">
          <img src="../assets/img/gallery/twilight_friends.png" alt="Twilight Sparkle hanging out with her friends while they eat cupcakes.">
        </a>
        <figcaption>Twilight Sparkle and some of her closest friends.</figcaption>
      </figure>

      <figure>
        <a href="https://mlp.fandom.com/wiki/Golden_Oak_Library">
          <img src="../assets/img/gallery/twilight_home.png" alt="Twilight Sparkle's home, the Golden Oak Library'.">
        </a>
        <figcaption>Twilight Sparkle lives in this amazing tree house, the Golden Oak Library.</figcaption>
      </figure>

      <figure>
        <a href="https://mlp.fandom.com/wiki/Sparkle_family">
          <img src="../assets/img/gallery/twilight_parents.png" alt="Twilight Sparkle's parents, Twilight Velvet and Night Light.">
        </a>
        <figcaption>Twilight Velvet and Night Light are the parents of Twilight Sparkle, seen here at their wedding.</figcaption>
      </figure>
